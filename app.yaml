# ============================================================
# sftp-server 应用配置（YAML）
# 优先级：app.yaml 默认值 < 环境变量（同名环境变量可覆盖）
# 必填项：database_url、jwt_secret
# 也可通过环境变量 CONFIG_FILE 指定其他配置文件路径
# ============================================================

# MySQL 连接串（必须）
database_url: "mysql://root:111111@192.168.10.236:3306/sftp_server"

# MySQL 会话时区（DATETIME DEFAULT CURRENT_TIMESTAMP 以此时区写入）
# 常见值：+08:00（北京时间，默认）、UTC、-05:00（美东）
db_timezone: "+08:00"

# SFTP 监听地址（不要用 22，避免与系统 sshd 冲突）
sftp_bind: "0.0.0.0:2222"

# HTTP 管理 API 监听地址
# 0.0.0.0:8080 表示对外可访问；如需仅本机访问可改为 127.0.0.1:8080 并通过 Nginx 反向代理
http_bind: "0.0.0.0:8080"

# 后台 JWT 签名密钥（务必修改为强随机串）
jwt_secret: "jwt_secret_sftp_server_7691"
jwt_expire_hours: 12

# SFTP 主机私钥文件路径，不存在时自动生成（生产建议备份）
host_key_path: "host_key"

# 日志目录
log_dir: "logs"

# admin_user 表为空时自动创建的默认管理员
admin_user: "admin"
admin_password: "Admin@123456"
