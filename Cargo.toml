[package]
name = "sftp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"

tokio = { version = "1", features = ["full"] }
dashmap = "6.2"

sqlx = { version = "0.8", features = [
    "mysql",
    "runtime-tokio",
    "macros",
    "migrate",
    "chrono",
] }

ipnet = "2"
argon2 = "0.5"

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
jsonwebtoken = "9"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
dotenvy = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
